
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LinkShield</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0B1220;
            color: #ffffff;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: #111B2B;
            border: 1px solid #263449;
            border-radius: 14px;
        }

        .logo {
            color: #38BDF8;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            background: #0B1220;
            border: 1px solid #334155;
            border-radius: 7px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38BDF8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1D4ED8;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #94A3B8;
            font-size: 14px;
        }

        .register-link a {
            color: #38BDF8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">LinkShield</div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Sign in to access your security dashboard
        </p>

        <form action="/login" method="POST">
            <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
            >

            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</body>
</html>
