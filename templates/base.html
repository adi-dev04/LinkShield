
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LinkShield{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h3>🛡 LinkShield</h3>
                <p>Security Dashboard</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="/url-scanner" class="nav-link {% if request.url.path == '/url-scanner' %}active{% endif %}">
                    URL Scanner
                </a>
                <a href="/file-scanner" class="nav-link {% if request.url.path == '/file-scanner' %}active{% endif %}">
                    File Scanner
                </a>
                <a href="/history" class="nav-link {% if request.url.path == '/history' %}active{% endif %}">
                    Scan History
                </a>
                <a href="/results/latest" class="nav-link {% if request.url.path.startswith('/results/') %}active{% endif %}">
                    Scan Results
                </a>
            </nav>
            <div class="sidebar-footer">
                <span>LinkShield v1.0</span>
                <form action="/logout" method="POST" style="margin-top: 15px;">
                    <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ request.session.get('csrf_token', '') }}"
                    >
                    <button
                    type="submit"
                    style="
                    width: 100%;
                    padding: 10px;
                    background: #1E293B;
                    color: #F87171;
                    border: 1px solid #334155;
                    border-radius: 7px;
                    cursor: pointer;
                    ">
                    ↪ Logout
                </button>
            </form>
        </div>

        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h5>{% block page_heading %}Security Overview{% endblock %}</h5>
                <span class="status-indicator">● System Online</span>
            </header>

            <section class="page-content">
                {% block content %}{% endblock %}
            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
    <script src="{{ url_for('static', path='js/main.js') }}"></script>

</body>
</html>
